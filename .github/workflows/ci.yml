name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - python-lib  # temporary until branch merged
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Java build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.4

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Verify local publication
        run: ./gradlew --no-daemon publishToMavenLocal

  python:
    name: Python test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        working-directory: python
        run: python -m pip install --upgrade pip pytest && python -m pip install .

      - name: Run Python tests
        working-directory: python
        run: python -m pytest
